<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {% set target = pathto(redirects[pagename]) %}
  <title>Page moved</title>
  <link rel="canonical" href="{{ target }}">
  <meta name="robots" content="noindex">
  <script>location.replace({{ target | tojson }} + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url={{ target }}">
</head>
<body>
  <p>This guide has moved. <a href="{{ target }}">Open the current guide</a>.</p>
</body>
</html>

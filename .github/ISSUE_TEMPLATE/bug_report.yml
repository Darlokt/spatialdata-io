name: Bug report
description: Report something that is broken or incorrect
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        **Note**: Please read [this guide](https://matthewrocklin.com/blog/work/2018/02/28/minimal-bug-reports)
        detailing how to provide the necessary information for us to reproduce your bug. In brief:
          * Please provide exact steps how to reproduce the bug in a clean Python environment.
          * In case it's not clear what's causing this bug, please provide the data or the data generation procedure.
          * Replicate problems on public datasets or share data subsets when full sharing isn't possible.

  - type: textarea
    id: report
    attributes:
      label: Report
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        Run this in the Python session where you reproduced the issue.
        `session-info2` is included with spatialdata-io. In a notebook, display the
        result directly for the “Copy as Markdown” button. In a console, use the
        following commands and paste the output.

        ```python
        import spatialdata_io
        import session_info2

        print(session_info2.session_info(dependencies=True))
        ```
      render: text
      placeholder: |
        Paste the session-info2 output, including package versions, Python and OS.

[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "spatialdata-io"
description = "SpatialData IO for common techs"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "scverse", email = "scverse@scverse.scverse" },
]
authors = [
  { name = "scverse" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dynamic = [
  "version", # allow version to be set by git tags
]
dependencies = [
  "anndata>=0.13",
  "click",
  "dask[array,dataframe]",
  "geopandas",
  "h5py",
  "imagecodecs>=2026.5.10",
  "numpy",
  "ome-types",
  "pandas>=3",
  "pyarrow",
  "pyogrio",
  "pyyaml",
  "readfcs",
  "scanpy",
  "scipy>=1.15",
  "shapely",
  "spatialdata>=0.7.3a0",
  "tifffile>=2026.5.2",
  "xarray",
  "zarr>=3.2",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://spatialdata-io.readthedocs.io/"
urls.Homepage = "https://github.com/scverse/spatialdata-io"
urls.Source = "https://github.com/scverse/spatialdata-io"

[dependency-groups]
dev = [
  "pandas-stubs",
  "pooch>=1.9",
  "prek>=0.5",
  "pyproject-fmt>=2.26",
  "pyrefly>=1.4",
  "requests",
  "ruff>=0.17.2",
  "scipy-stubs",
  "twine>=4.0.2",
  "types-geopandas",
  "types-pyyaml",
  "types-shapely",
  "zizmor>=1.28",
]
test = [
  # PyArrow 22 cannot read two deliberately truncated Xenium test fixtures.
  # https://github.com/scverse/spatialdata-io/issues/334
  "pyarrow!=22",
  "pytest",
  "pytest-cov>=7",
  "pytest-mock",
  "pytest-xdist>=3.8",
]
doc = [
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  "scverse-misc[sphinx]>=0.1.2",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-click",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "_version.py"
build.targets.wheel.packages = [ "src/spatialdata_io" ]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-check-code.detached = true
envs.hatch-check-code.dependencies = []
envs.hatch-check-code.scripts.lint-check = """\
  uv run --no-sync --no-active ruff check --no-fix {env:HATCH_CHECK_CODE_ARGS:} {args:.}\
  """
envs.hatch-check-code.scripts.lint-fix = """\
  uv run --no-sync --no-active ruff check --fix {env:HATCH_CHECK_CODE_ARGS:} {args:.}\
  """
envs.hatch-check-code.config-path = "none"
envs.hatch-check-fmt.detached = true
envs.hatch-check-fmt.dependencies = []
envs.hatch-check-fmt.scripts.format-check = """\
  uv run --no-sync --no-active ruff format --check --diff {env:HATCH_CHECK_FMT_ARGS:} {args:.}\
  """
envs.hatch-check-fmt.scripts.format-fix = """\
  uv run --no-sync --no-active ruff format {env:HATCH_CHECK_FMT_ARGS:} {args:.}\
  """
envs.hatch-check-fmt.config-path = "none"
envs.hatch-check-types.detached = true
envs.hatch-check-types.dependencies = []
envs.hatch-check-types.scripts.check = "uv run --no-sync --no-active pyrefly check {args}"
envs.hatch-check-types.scripts.check-summarize = "uv run --no-sync --no-active pyrefly check --summarize-errors {args}"
envs.hatch-check-types.scripts.config = "uv run --no-sync --no-active pyrefly dump-config {args}"
envs.hatch-check-types.scripts.coverage = "uv run --no-sync --no-active pyrefly coverage report {args}"
envs.hatch-check-types.config-path = "none"
envs.hatch-static-analysis.detached = true
envs.hatch-static-analysis.dependencies = []
envs.hatch-static-analysis.scripts.format-check = """\
  uv run --no-sync --no-active ruff format --check --diff {env:HATCH_FMT_ARGS:} {args:.}\
  """
envs.hatch-static-analysis.scripts.format-fix = """\
  uv run --no-sync --no-active ruff format {env:HATCH_FMT_ARGS:} {args:.}\
  """
envs.hatch-static-analysis.scripts.lint-check = """\
  uv run --no-sync --no-active ruff check --no-fix {env:HATCH_FMT_ARGS:} {args:.}\
  """
envs.hatch-static-analysis.scripts.lint-fix = """\
  uv run --no-sync --no-active ruff check --fix {env:HATCH_FMT_ARGS:} {args:.}\
  """
envs.hatch-static-analysis.config-path = "none"
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [ "benchmarks", "src" ]
include = [ "*.ipynb", "*.md", "*.py", "*.pyi" ]
fix = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "lf"
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # conflicts with the formatter
  "CPY001", # the repository does not require source-file copyright headers
]
lint.per-file-ignores."docs/**/*.ipynb" = [
  "PLR2004", # small verification values are clearer inline in tutorials
  "S101",    # executable tutorials use assertions to verify stages
]
lint.per-file-ignores."docs/conf.py" = [
  "INP001", # standalone Sphinx configuration; docs is not a package
]
lint.per-file-ignores."scripts/test_data_downloader/*.py" = [
  "INP001", # directory script with local sibling imports, invoked directly by path
]
lint.per-file-ignores."scripts/test_data_downloader/downloader.py" = [
  "T201", # CLI progress, listing and error output are part of the command contract
]
lint.per-file-ignores."scripts/test_data_downloader/manifest.py" = [
  "TRY004", # malformed TOML schema values use the documented ValueError contract
]
lint.per-file-ignores."tests/**/*.py" = [
  "D1",      # test modules, fixtures and test names do not need public API docstrings
  "PLR2004", # small numeric examples are clearer inline in tests
  "S101",    # pytest uses assert rewriting
  "SLF001",  # unit tests exercise private implementation boundaries
]
lint.pydocstyle.convention = "numpy"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.pyrefly]
python-version = "3.12"
project-includes = [
  "benchmarks",
  "src",
  "tests",
]
project-excludes = [
  "build",
  "dist",
  "docs/_build",
]
search-path = [ ".", "src" ]
errors.unused-ignore = "error"
errors.unused-type-ignore = "error"
check-unannotated-defs = true
ignore-missing-imports = []
infer-return-types = "checked"
infer-with-first-use = true
min-severity = "warn"
output-format = "full-text"
preset = "strict"
type-ignore-unknown-tag-behavior = "no-effect"
use-ignore-files = true

[tool.pytest]
addopts = [
  "--import-mode=importlib",   # allow using test files with same name
  "--cov=spatialdata_io",
  "--cov-branch",
  "--cov-report=term-missing",
]
# used by the third-party test modules that `anndata.tests.helpers` and
# `spatialdata.testing` pull in, which strict marker checking would otherwise reject
markers = [
  "array_api",
  "cli: command-line interface tests",
  "codex: tests for the codex reader",
  "cosmx: tests for the cosmx reader",
  "curio: tests for the curio reader",
  "data: tests that require optional downloaded test datasets",
  "dbit: tests for the dbit reader",
  "generic: tests for the generic reader module",
  "gpu",
  "integration: multi-component tests, file I/O tests, or reader workflow tests",
  "iss: tests for the iss reader",
  "macsima: tests for the macsima reader",
  "mcmicro: tests for the mcmicro reader",
  "merscope: tests for the merscope reader",
  "seqfish: tests for the seqfish reader",
  "skip_with_pyarrow_strings",
  "slow: tests with comparatively high runtime",
  "steinbock: tests for the steinbock reader",
  "stereoseq: tests for the stereoseq reader",
  "unit: fast isolated tests that do not require external datasets",
  "visium: tests for the visium reader",
  "visium_hd: tests for the visium_hd reader",
  "xenium: tests for the xenium reader",
]
strict = true
testpaths = [ "tests" ]
xfail_strict = true

[tool.coverage]
run.source = [ "spatialdata_io" ]
run.omit = [
  "**/test_*.py",
]
run.branch = true
run.patch = [ "subprocess" ]
report.show_missing = true

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]

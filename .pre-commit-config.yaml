fail_fast: false
default_stages:
  - pre-commit
  - pre-push
# Equal priorities may run together; lower priorities finish first.
# Text fixers overlap, and pyproject-fmt must finish before other uv hooks read its output.
priorities:
  line-endings: 10
  trailing-whitespace: 20
  final-newline: 30
  project-config: 40
  fixes: 50
  format: 60
  checks: 70
repos:
  - repo: builtin
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
        priority: line-endings
      - id: trailing-whitespace
        priority: trailing-whitespace
      - id: end-of-file-fixer
        priority: final-newline
      - id: pretty-format-json
        args: [--autofix, --indent=4, --no-sort-keys]
        exclude: ^\.cruft\.json$ # cruft owns this file
        priority: fixes
      - id: detect-private-key
        priority: checks
      - id: check-case-conflict
        priority: checks
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]
        priority: checks
  - repo: local
    hooks:
      - id: pyproject-fmt
        name: pyproject-fmt
        entry: uv run --no-sync pyproject-fmt
        language: system
        files: (^|/)pyproject\.toml$
        priority: project-config
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        priority: fixes
      - id: zizmor
        name: zizmor
        entry: uv run --no-sync zizmor --no-progress --fix
        language: system
        types: [yaml]
        files: ^(\.github/(workflows/[^/]+|dependabot)\.ya?ml|(.*/)?action\.ya?ml)$
        priority: fixes
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi, jupyter, markdown]
        priority: format
      - id: pyrefly
        name: pyrefly
        entry: uv run --no-sync pyrefly check
        language: system
        types: [file]
        files: ^((benchmarks|src|tests)/.*\.pyi?$|pyproject\.toml$)
        priority: checks
        require_serial: true
        pass_filenames: false
